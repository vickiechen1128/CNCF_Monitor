# =====================================================================
# 二轮增量（决策 113「最小运行骨架自动布缆」口径 C + route 前台化 v0.3-a/b/c）
# 计划版本：v2026-09-30（承接决策 113；重排自设计提案 alert-route-frontend-editor.md）
#
# 【前置事实（决策 113，不可再议）】
#   1. Alertmanager 0.34 无 `route_files` 顶层键；平台只向 config-output/alertmanager.yml 写一个文件。
#      故 PRD §4.1.1（决策 113 与提案误引为 §4.9，属提案章节号错位）的 route_files 合并方案不可实现。
#   2. 口径 B（在用户 route.routes[] 末端追加平台兜底子路由）已否决——会进有顺序语义的数组，
#      且用户某兄弟子路由 continue:true 时同一告警双发。
#   3. 口径 A 降级为「平台管理模式」的固有行为（根 receiver 指向默认接收人），不单独做、不单开决策。
#   4. 口径 C 采纳：默认（手写）模式 + 用户显式开关下，平台只原地替换根 route.receiver 单键。
#      绝不触碰 group_by / group_wait / group_interval / repeat_interval / continue，绝不写 route.routes[]。
#   5. 开关与 PRD P3「默认接收人」配置项合并为同一件事（选定默认接收人 = 授权平台接管根兜底）。
#   6. 默认接收人取值：已启用渠道按 id 升序第一个，复用 NotifyChannel.ReceiverName()。
#   7. 三条护栏：①开启二次确认；②根兜底被替换时进 M09 变更单明示；③关闭 = 停止替换、不删最后写入的值。
#   8. 根 route 的 group_by / 节奏字段归属仍归用户手写。
#
# 【已拍板（2026-09-30，用户确认；下列结论为任务实现形态的约束）】
#   Q1 默认接收人持久化形态 = 新增管理域单例表 alertmanager_route_settings
#      （与 alertmanager.yml 同管理域 default；语义独立、不污染 NotifyChannel 模型）→ 约束 T08-08 / T08-11
#   Q2 首发支持用户显式指定默认接收人 → 约束 T08-F8（下拉选择项）+ T08-11（PUT 接口）
#   Q3 「骨架布缆开关」与「模式开关」= 两个独立控件；平台托管模式下布缆开关转只读展示 → 约束 T08-F8 / T08-F12
#   Q4 改设定后 = 与挂载同构 autoApply（触发重算 + 管理域自动确认下发 + AM reload）→ 约束 T08-11
#   Q5 PRD §9.1「平台托管的接收人自动获得骨架」= 改为「用户选定默认接收人后获得」→ 约束 T08-D2
#   Q6 批次 A 与批次 B = 合一个 PR（内部两个 commit_group）→ 约束 T08-D1 / PR 编排
#   Q7 顺序调整交互下限 = 上移/下移必做 + 拖拽增强（原生 HTML5 draggable，零新增依赖）→ 约束 T08-F11
