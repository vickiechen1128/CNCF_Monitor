name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
      - 'feature/prototype-*'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all module prototypes
        run: cd docs/prototypes && ./build-all.sh

      - name: Prepare deployment directory
        run: |
          cd docs/prototypes
          mkdir -p _site
          cp index.html _site/
          for module in module-*/; do
            if [ -d "${module}dist" ]; then
              mkdir -p "_site/${module}"
              cp -r "${module}dist" "_site/${module}dist"
            fi
          done

      - name: Determine destination directory
        id: dest
        run: |
          branch="${{ github.ref_name }}"
          if [[ "$branch" == "develop" || "$branch" == "main" ]]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/prototypes/_site
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
