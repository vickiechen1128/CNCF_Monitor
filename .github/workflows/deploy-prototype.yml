name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - 'feature/prototype-*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: ui-custom/web/pnpm-lock.yaml

      - name: Install dependencies
        run: cd ui-custom/web && pnpm install

      - name: Build prototype
        run: cd ui-custom/web && pnpm build --base=/CNCF_Monitor/${{ github.ref_name }}/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ui-custom/web/dist
          destination_dir: ${{ github.ref_name }}
          keep_files: true
