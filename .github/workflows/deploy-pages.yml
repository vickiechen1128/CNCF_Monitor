name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/prototypes/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all module prototypes
        run: cd docs/prototypes && ./build-all.sh

      - name: Prepare deployment directory
        run: |
          cd docs/prototypes
          mkdir -p _site
          cp index.html _site/
          for module in module-*/; do
            if [ -d "${module}dist" ]; then
              mkdir -p "_site/${module}"
              cp -r "${module}dist" "_site/${module}dist"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/prototypes/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
