# MetricCenter 业务分组字典（business_domains）
#
# 用法：MVP 由配置文件预置，改动后热加载生效（无需重启，P0 验收项）。
# 本文件供资源录入 / Excel 导入校验的下拉与合法性校验使用，并映射为 biz label。
#
# 字段说明：
#   - code        业务编码（biz_code）：不可变主键，永不可改、停用不删除（决策 17/21/22）；
#                 编码规范：小写字母、数字、连字符，长度 ≤ 64；上线前须命名评审。
#   - name        展示名（biz_name）：可改，仅 UI 展示，修改不影响监控配置。
#   - description 描述：可改。
#   - enabled     启用状态：停用条目不可被新资源/新增/编辑选用，存量资源保留历史值。
#
# 强制预置兜底条目 infra：公共基础设施，无业务归属的设备类资源统一挂 infra，
# 避免必填逼出假业务污染 biz 聚合。
#
# 命名评审记录（上线前必填）：
#   infra      公共基础设施兜底（强制）
#   payment    支付业务
#   data-api   数据接口业务

- code: infra
  name: 公共基础设施
  description: 公共基础设施兜底，无业务归属的设备类资源统一挂载
  enabled: true

- code: payment
  name: 支付业务
  description: 支付业务域，覆盖支付核心链路相关资源
  enabled: true

- code: data-api
  name: 数据接口业务
  description: 数据接口业务域，覆盖对外数据服务相关资源
  enabled: true

- code: legacy
  name: 遗留系统
  description: 遗留业务示例（停用条目，不可被新资源选用）
  enabled: false
