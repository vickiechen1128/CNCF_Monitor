# MetricCenter 业务分组字典（business_domains）
#
# 用法：MVP 由配置文件预置，改动后热加载生效（无需重启，P0 验收项）。
# 本文件供资源录入 / Excel 导入校验的下拉与合法性校验使用，并映射为 biz label。
#
# 字段说明：
#   - code        业务编码（biz_code）：不可变主键，永不可改、停用不删除（决策 17/21/22）；
#                 编码规范：小写字母、数字、连字符，长度 ≤ 64；上线前须命名评审。
#   - name        展示名（biz_name）：可改，仅 UI 展示，修改不影响监控配置。
#   - description 描述：可改。
#   - enabled     启用状态：停用条目不可被新资源/新增/编辑选用，存量资源保留历史值。
#
# MVP 预置两条业务（chenrt 2026-08-24 确认）：
#   authorized-ops        授权运营
#   data-innovation-lab   数据创新实验室
#
# 命名评审记录（上线前必填）：
#   authorized-ops        授权运营（MVP 预置）
#   data-innovation-lab   数据创新实验室（MVP 预置）

- code: authorized-ops
  name: 授权运营
  description: 授权运营业务域，覆盖授权运营相关资源
  enabled: true

- code: data-innovation-lab
  name: 数据创新实验室
  description: 数据创新实验室业务域，覆盖数据创新相关资源
  enabled: true