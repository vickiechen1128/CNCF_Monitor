# MetricCenter 业务分组字典（business_domains）导入模板
#
# 重要：本文件**不再预置任何业务字典**。全新部署时业务字典为空，
# 由运维在「资源管理 → 业务管理」页面按实际组织登记。
#
# 本文件仅保留为「可选的一次性导入模板」：当数据库 business_domains 表为空时，
# 启动过程会读取本文件；列表为空或文件缺失时不导入任何条目，也不阻断启动。
# 数据库非空时本文件被完全忽略，DB 为唯一权威。
#
# 字段说明：
#   - code        业务编码（biz_code）：不可变主键，永不可改、永不复用；
#                 编码规范：小写字母、数字、连字符，长度 ≤ 64；上线前须命名评审。
#   - name        展示名（biz_name）：可改，仅 UI 展示，修改不影响监控配置。
#   - description 描述：可改。
#   - enabled     启用状态：停用条目不可被新资源选用，存量资源保留历史值。
#
# 使用示例（取消注释后重启，仅在 DB 为空时生效）：
#
# - code: payment
#   name: 支付业务
#   description: 支付相关资源
#   enabled: true
